version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: careerpilot:latest
    container_name: careerpilot_app

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production

    command: npm start

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s